[tools]
node = "latest"
oxfmt = "latest"
oxlint = "latest"
markdownlint-cli2 = "latest"
pre-commit = "latest"

# emmet-language-server
"npm:@olrtg/emmet-language-server" = "latest"

# HTML linter
"npm:htmlhint" = "latest"

# This is the new Typescript Go fork which even supports LSP
# "npm:typescript/native-preview" = "latest"

# New Rust based CSS LSP
"npm:csskit" = "latest"

# The Rust based live-server is safer and faster
"cargo:live-server" = "latest"

[env]
CURR_PROJECT = "./projects/word-masters"

[tools.rust]
version = "stable"
components = ["clippy", "rustfmt"]

[tasks.serve]
description = "Run live-server against $CURR_PROJECT"
run = """
live-server --host 127.0.0.1 --port 8080 $CURR_PROJECT
"""

[tasks.setup]
description = "Generate .pre-commit-config.yaml and install git hooks"
run = """
cat > .pre-commit-config.yaml << 'EOF'
repos:
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        language: system
        entry: oxlint
        args: ["."]
        pass_filenames: false

      - id: oxfmt
        name: oxfmt
        language: system
        entry: oxfmt
        args: ["."]
        pass_filenames: false

      - id: markdownlint-cli2
        name: markdownlint-cli2
        language: system
        entry: markdownlint-cli2
        types: [markdown]

      - id: htmlhint
        name: htmlhint
        language: system
        entry: htmlhint
        types: [html]
EOF
pre-commit install
"""

