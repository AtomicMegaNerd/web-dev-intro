[tools]
"npm:@olrtg/emmet-language-server" = "2.8.0"
"npm:htmlhint" = "1.9.2"
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:live-server" = "1.2.2"
"npm:@typescript/native-preview" = "latest"
oxfmt = "latest"
oxlint = "latest"
markdownlint-cli2 = "latest"

[tasks.lint]
run = "oxlint ."

[tasks.format]
run = "oxfmt ."

[tasks.check]
run = "oxlint . && oxfmt --check ."
