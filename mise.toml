[tools]
node = "latest"
oxfmt = "latest"
oxlint = "latest"
markdownlint-cli2 = "latest"
pre-commit = "latest"

# npm packages
"npm:@olrtg/emmet-language-server" = "latest"
"npm:htmlhint" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:live-server" = "latest"
"npm:@typescript/native-preview" = "latest"

[tasks.setup]
description = "Generate .pre-commit-config.yaml and install git hooks"
run = """
cat > .pre-commit-config.yaml << 'EOF'
repos:
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        language: system
        entry: oxlint
        args: ["."]
        pass_filenames: false

      - id: oxfmt
        name: oxfmt
        language: system
        entry: oxfmt
        args: ["."]
        pass_filenames: false

      - id: markdownlint-cli2
        name: markdownlint-cli2
        language: system
        entry: markdownlint-cli2
        types: [markdown]

      - id: htmlhint
        name: htmlhint
        language: system
        entry: htmlhint
        types: [html]
EOF
pre-commit install
"""
