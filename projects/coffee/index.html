<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Masters</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/coffee.css" />
  </head>
  <body>
    <div class="main-banner">
      <div class="main-logo">
        <img
          class="main-logo-image"
          src="./img/coffee_masters_logo.png"
          alt="Coffe Masters"
        />
        <span class="main-logo-text">Coffee Masters</span>
      </div>
    </div>
    <div class="main-page">
      <!-- items pane -->
      <section class="items-pane box">
        <div class="pane-title">ITEMS</div>
        <div class="menu-items-list">
          <div class="menu-item">
            <div class="menu-item-amount">1x</div>
            <div class="menu-item-sku">Cappucino</div>
            <div class="menu-item-price">$6.00</div>
            <div class="ingredients">
              <div class="ingredient">Light Foam</div>
            </div>
          </div>
          <div class="menu-item">
            <div class="menu-item-amount">1x</div>
            <div class="menu-item-sku">Cappucino</div>
            <div class="menu-item-price">$7.90</div>
            <div class="ingredients">
              <div class="ingredient">Almond Milk</div>
              <div class="ingredient">Double Espresso Shot</div>
            </div>
          </div>
          <div class="menu-item">
            <div class="menu-item-amount">1x</div>
            <div class="menu-item-sku">Croissant</div>
            <div class="menu-item-price">$5.37</div>
            <div class="ingredients">
              <div class="ingredient">Butter</div>
            </div>
          </div>
        </div>
      </section>

      <section class="name-pane box">
        <div class="pane-title">NAME</div>
        <div class="input-group">
          <label for="name" class="text-input-label">Name for order</label>
          <input id="name" class="text-input wide" />
        </div>
      </section>
      <section class="payment-pane box">
        <div class="pane-title">PAYMENT</div>

        <div class="input-group">
          <label for="cardnum" class="text-input-label">Card Number</label>
          <input id="cardnum" class="text-input wide" />
        </div>
        <div class="input-group">
          <label for="ccv" class="text-input-label">CCV Number</label>
          <input id="ccv" class="text-input" />
        </div>
      </section>
      <section class="totals-pane">
        <div class="totals-line">
          <div class="subtotal-label">Subtotal:</div>
          <div class="subtotal">$9.65</div>
        </div>
        <div class="totals-line">
          <div class="tax-label">Tax:</div>
          <div class="tax">$0.82</div>
        </div>
        <div class="totals-line">
          <div class="total-label">Total:</div>
          <div class="total">$10.47</div>
        </div>
      </section>
      <section class="place-order-pane">
        <input class="place-order-button" type="button" value="Place Order" />
      </section>
    </div>
  </body>
</html>
