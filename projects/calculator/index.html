<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>RCD Calc</title>
  </head>
  <body>
    <div class="calc-main">
      <div class="calc-output-container"><span class="calc-output"></span></div>
      <div class="calc-button-container">
        <!-- first row -->
        <button class="calc-button button-clear">C</button>
        <button class="calc-button button-back">B</button>
        <button class="calc-button button-div orange">%</button>
        <!-- second row -->
        <button class="calc-button button-7">7</button>
        <button class="calc-button button-8">8</button>
        <button class="calc-button button-9">9</button>
        <button class="calc-button button-mul orange">*</button>
        <!-- third row -->
        <button class="calc-button button-4">4</button>
        <button class="calc-button button-5">5</button>
        <button class="calc-button button-6">6</button>
        <button class="calc-button button-sub orange">-</button>
        <!-- fourth row -->
        <button class="calc-button button-1">1</button>
        <button class="calc-button button-2">2</button>
        <button class="calc-button button-3">3</button>
        <button class="calc-button button-add orange">+</button>
        <!-- fifth row -->
        <button class="calc-button button-0">0</button>
        <button class="calc-button button-equals orange">=</button>
      </div>
    </div>
    <script src="./js/calc.js"></script>
  </body>
</html>
