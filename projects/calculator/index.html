<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>RCD Calc</title>
  </head>
  <body>
    <div class="calc-main">
      <div class="calc-output"></div>
      <div class="calc-button-container">
        <!-- first row -->
        <button class="calc-button button-clear grey">C</button>
        <button class="calc-button button-back grey">B</button>
        <button class="calc-button button-div orange">%</button>
        <!-- second row -->
        <button class="calc-button button-7 grey">7</button>
        <button class="calc-button button-8 grey">8</button>
        <button class="calc-button button-9 grey">9</button>
        <button class="calc-button button-mul orange">*</button>
        <!-- third row -->
        <button class="calc-button button-4 grey">4</button>
        <button class="calc-button button-5 grey">5</button>
        <button class="calc-button button-6 grey">6</button>
        <button class="calc-button button-sub orange">-</button>
        <!-- fourth row -->
        <button class="calc-button button-1 grey">1</button>
        <button class="calc-button button-2 grey">2</button>
        <button class="calc-button button-3 grey">3</button>
        <button class="calc-button button-plus orange">+</button>
        <!-- fifth row -->
        <button class="calc-button button-0 grey"></button>
        <button class="calc-button button-equals orange"></button>
      </div>
    </div>
  </body>
</html>
