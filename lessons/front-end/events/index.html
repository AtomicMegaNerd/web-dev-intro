<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events and Listeners</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <h1>Events and Listeners</h1>
    <section>
      <h2>Fun with Buttons</h2>
      <button type="submit" class="event-button">Click me!</button>
    </section>

    <section>
      <h2>Fun with Input</h2>
      <input placeholder="Type into me!" type="text" class="p-copy-src" />
      <p class="p-copy-target">Nothing has happened yet.</p>
    </section>

    <section>
      <h2>Fun with Boxes</h2>
      <div class="color-box"></div>
      <input placeholder="Type a color here!" type="text" class="color-box-color-src" />
    </section>

    <section>
      <h2>Fun with Buttons Redux</h2>
      <div class="button-container">
        <button type="submit" class="button-container-button">1</button>
        <button type="submit" class="button-container-button">2</button>
        <button type="submit" class="button-container-button">3</button>
        <button type="submit" class="button-container-button">4</button>
        <button type="submit" class="button-container-button">5</button>
      </div>
    </section>

    <script src="./js/script.js"></script>
  </body>
</html>
